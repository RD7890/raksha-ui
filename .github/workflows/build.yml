name: Build Raksha APK

on:
  push:
    branches: [ "main", "release/**" ]
    paths-ignore: [ '**.md', '.github/**' ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Raksha APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 17 ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache ───────────────────────────────────────────────────────
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 4. Signing keystore ───────────────────────────────────────────────────
      - name: Restore or generate signing keystore
        run: |
          mkdir -p signing
          if [ -f signing/signing-key.jks ]; then
            echo "Using committed keystore: $(wc -c < signing/signing-key.jks) bytes"
          elif [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > signing/signing-key.jks
            echo "Keystore from secret: $(wc -c < signing/signing-key.jks) bytes"
          else
            echo "No keystore found — generating and committing persistent one."
            keytool -genkeypair -v \
              -keystore signing/signing-key.jks \
              -storetype PKCS12 \
              -storepass raksha123 \
              -keypass raksha123 \
              -alias raksha \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Raksha UI,OU=Mobile,O=RakshaUI,L=India,ST=Odisha,C=IN"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "github-actions[bot]"
            git add signing/signing-key.jks
            git commit -m "chore: persist signing keystore [skip ci]"
            git push
          fi

      # ── 5. local.properties ───────────────────────────────────────────────────
      - name: Create local.properties
        run: |
          printf 'signing.storeFile=signing/signing-key.jks\nsigning.storePassword=raksha123\nsigning.keyAlias=raksha\nsigning.keyPassword=raksha123\n' \
            > local.properties

      # ── 6. Setup Gradle ───────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # ── 7. Auto version bump ──────────────────────────────────────────────────
      - name: Bump version
        run: |
          BUILD=${{ github.run_number }}
          VER_NAME="1.0.${BUILD}"
          sed -i "s/versionCode = [0-9]*/versionCode = ${BUILD}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
          echo "versionCode → ${BUILD}"
          echo "versionName → ${VER_NAME}"

      # ── 8. Build Release APK ──────────────────────────────────────────────────
      - name: Assemble Release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 9. Version info ───────────────────────────────────────────────────────
      - name: Get version info
        id: version
        run: |
          VER=$(grep 'versionName' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          echo "name=$VER"                      >> $GITHUB_OUTPUT
          echo "apk_name=Raksha-v${VER}.apk"   >> $GITHUB_OUTPUT
          echo "Version: $VER"

      # ── 10. Rename APKs ───────────────────────────────────────────────────────
      - name: Rename APKs
        run: |
          VER="${{ steps.version.outputs.name }}"
          OUTDIR="app/build/outputs/apk/release"
          # Gradle splits naming: app-<abi>-release.apk  +  app-universal-release.apk
          declare -A ABI_LABELS=(
            ["armeabi-v7a"]="armv7-watch-32bit"
            ["arm64-v8a"]="arm64-phone-64bit"
            ["x86_64"]="x86_64-emulator"
            ["universal"]="universal-all-devices"
          )
          for ABI in "${!ABI_LABELS[@]}"; do
            SRC="$OUTDIR/app-${ABI}-release.apk"
            if [ -f "$SRC" ]; then
              DEST="$OUTDIR/Raksha-UI-v${VER}-${ABI_LABELS[$ABI]}.apk"
              cp "$SRC" "$DEST"
              echo "Renamed: $SRC → $DEST"
            fi
          done
          echo "All APKs in $OUTDIR:"
          ls -lh "$OUTDIR"/Raksha-UI-*.apk

      # ── 11. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true          # storage quota se build block na ho
        with:
          name: Raksha-UI-v${{ steps.version.outputs.name }}-all-apks
          path: app/build/outputs/apk/release/Raksha-UI-*.apk
          retention-days: 1

      # ── 12. GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "Raksha UI v${{ steps.version.outputs.name }}"
          body: |
            **Package:** `com.raksha.ui` | **Build:** #${{ github.run_number }} | **Commit:** `${{ github.sha }}`

            | APK | Device |
            |-----|--------|
            | `Raksha-UI-v${{ steps.version.outputs.name }}-armv7-watch-32bit.apk` | **S9 Ultra / 32-bit watches** ← Install this |
            | `Raksha-UI-v${{ steps.version.outputs.name }}-arm64-phone-64bit.apk` | 64-bit ARM devices |
            | `Raksha-UI-v${{ steps.version.outputs.name }}-universal-all-devices.apk` | All devices |

            > Long-press home screen to change wallpaper.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/Raksha-UI-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
